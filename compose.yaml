services:
  sing-box:
    # Pinned to v1.14.4 (index digest sha256:0788ffbddab2c68a99a2dd4780bbc50902f159af6f589df3ee74a8389d278279). To upgrade, change the tag and the CI pin together.
    image: ghcr.io/sagernet/sing-box:v1.14.4
    container_name: sing-box
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
    command: -c /etc/sing-box/config.json run

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


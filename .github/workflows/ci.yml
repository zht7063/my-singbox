name: CI

on:
  push:
    branches: [ts-version]
  pull_request:

permissions:
  contents: read

env:
  SING_BOX_VERSION: v1.14.4
  MIHOMO_VERSION: v1.19.33

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats python3-yaml

      - name: Tool versions
        run: |
          shellcheck --version
          bats --version
          jq --version
          docker compose version

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.bash install.sh

      - name: Syntax check (bash -n)
        run: |
          for f in scripts/*.sh tests/*.bash install.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Bats tests
        run: bats --print-output-on-failure tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: |
          npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm run build
          test -f dist/cli.js && test -f dist/index.js
          node dist/cli.js doctor --help
          node tools/check-bundle.mjs
      - name: Package file list has no .env and no tests (AC9)
        run: node tools/check-pack.mjs

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm run license-scan

  runtime-validation:
    runs-on: ubuntu-latest
    name: runtime-validation (isp ${{ matrix.isp }})
    strategy:
      matrix:
        isp: ['off', 'on', 'incremental']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate and validate configurations
        env:
          ISP: ${{ matrix.isp }}
        run: |
          set +x
          cli="$GITHUB_WORKSPACE/dist/cli.js"
          dir="$RUNNER_TEMP/proj-$ISP"
          mkdir "$dir"
          cd "$dir"
          printf '8.8.8.8\n' | SING_BOX_VERSION="$SING_BOX_VERSION" node "$cli" gen-keys
          if [ "$ISP" = on ]; then
            printf '%s\n' 'ISP_SOCKS_ADDR=198.51.100.7:1080' 'ISP_SOCKS_USER="fixture-user"' 'ISP_SOCKS_PASS="ci-test-password"' 'ISP_SOCKS_EGRESS_IP=198.51.100.7' >> .env
          fi
          node "$cli" gen-config
          node "$cli" conf-clash
          cd "$GITHUB_WORKSPACE"
          cp "$dir/clash.yaml" "$dir/clash-before.yaml"
          apply_incremental() {
            node --input-type=module - "$dir" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { isDeepStrictEqual } from 'node:util';
          import { addIspToConfig, loadSingboxTemplate } from './dist/index.js';
          const dir = process.argv[2];
          const isp = { host: '198.51.100.7', port: 1080, addr: '198.51.100.7:1080', user: 'fixture-user', pass: 'ci-test-password', egressIp: '198.51.100.7' };
          const configPath = `${dir}/config.json`;
          const original = JSON.parse(readFileSync(configPath, 'utf8'));
          const updated = addIspToConfig(original, isp, loadSingboxTemplate(dir).route);
          if (!isDeepStrictEqual(original, updated)) writeFileSync(configPath, JSON.stringify(updated, null, 2) + '\n');
          NODE
          }
          if [ "$ISP" = incremental ]; then
            apply_incremental
          fi
          cmp "$dir/clash-before.yaml" "$dir/clash.yaml"
          node --input-type=module - "$dir" "$ISP" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { parse } from 'yaml';
          import { loadSingboxTemplate, readTemplate } from './dist/index.js';
          const [dir, mode] = process.argv.slice(2);
          const enabled = mode !== 'off';
          const config = JSON.parse(readFileSync(`${dir}/config.json`, 'utf8'));
          const template = loadSingboxTemplate(dir);
          assert.deepEqual(config.inbounds.map(({ tag, listen_port }) => [tag, listen_port]), [
            ['ss-in', 8388], ['vless-reality-in', 8443],
          ]);
          assert.deepEqual(config.outbounds.map(({ tag }) => tag).sort(), enabled ? ['direct', 'isp-socks'] : ['direct']);
          assert.equal(config.route.final, 'direct');
          assert.equal(config.route.rules[0].action, 'sniff');
          const defaults = template.route.rules.filter((rule) => rule.outbound === 'isp-socks');
          assert.equal(defaults.length, 1);
          assert.ok(defaults[0].domain_suffix.length > 0);
          assert.equal(defaults[0].inbound, undefined);
          assert.deepEqual(config.route.rules, template.route.rules.filter((rule) => enabled || rule.outbound !== 'isp-socks'));
          const ispRules = config.route.rules.filter((rule) => rule.outbound === 'isp-socks');
          assert.deepEqual(ispRules, enabled ? defaults : []);
          if (enabled) {
            const outbound = config.outbounds.find(({ tag }) => tag === 'isp-socks');
            assert.equal(outbound.type, 'socks');
            assert.equal(outbound.version, '5');
            assert.equal(outbound.server, '198.51.100.7');
            assert.equal(outbound.server_port, 1080);
            assert.equal(outbound.username, 'fixture-user');
            assert.equal(outbound.password, 'ci-test-password');
          } else {
            assert.ok(!JSON.stringify(config).includes('isp-socks'));
          }
          const clash = parse(readFileSync(`${dir}/clash.yaml`, 'utf8'));
          assert.deepEqual(clash.proxies.map(({ name, port }) => [name, port]), [
            ['shadowsocks', 8388], ['vless-reality', 8443],
          ]);
          assert.deepEqual(clash['proxy-groups'].find(({ name }) => name === 'Proxy').proxies, ['shadowsocks', 'vless-reality', 'DIRECT']);
          const clientTemplate = parse(readTemplate('clash.yaml.template', dir));
          for (const key of ['rules', 'rule-providers', 'dns']) assert.deepEqual(clash[key], clientTemplate[key]);
          console.log(`Validated two-node ISP ${mode} routing and unchanged client policy.`);
          NODE
          docker run --rm -v "$dir/config.json:/etc/sing-box/config.json:ro" ghcr.io/sagernet/sing-box:${SING_BOX_VERSION} check -c /etc/sing-box/config.json
          work=$(mktemp -d)
          curl -fsSL --retry 3 "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" -o "$work/mihomo.gz"
          echo "132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  $work/mihomo.gz" | sha256sum -c -
          gunzip "$work/mihomo.gz"
          chmod +x "$work/mihomo"
          "$work/mihomo" -v
          "$work/mihomo" -t -f "$dir/clash.yaml" -d "$work/data"
          if [ "$ISP" != off ]; then
            cp "$dir/config.json" "$work/config.json"
            apply_incremental
            cmp "$work/config.json" "$dir/config.json"
            cmp "$dir/clash-before.yaml" "$dir/clash.yaml"
            apply_incremental
            cmp "$work/config.json" "$dir/config.json"
            cmp "$dir/clash-before.yaml" "$dir/clash.yaml"
          fi

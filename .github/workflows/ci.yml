name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats

      - name: Tool versions
        run: |
          shellcheck --version
          bats --version
          jq --version

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/helpers.bash

      - name: Syntax check (bash -n)
        run: |
          for f in scripts/*.sh tests/helpers.bash; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Bats tests
        run: bats --print-output-on-failure tests/
